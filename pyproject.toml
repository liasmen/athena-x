[tool.poetry]
name = "athena-x"
version = "1.0.0"
description = "Institutional Investment Intelligence Platform"
authors = ["liasmen"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = { version = "^0.35.0", extras = ["standard"] }
sqlalchemy = "^2.0.43"
pydantic = "^2.11.7"
pandas = "^2.3.2"
numpy = "^2.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
httpx = "^0.28.1"
ruff = "^0.12.11"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
